[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "psift"
version = "0.0.2"
description = "A terminal tabular data explorer."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = [
    "cli",
    "console",
    "data",
    "dataframe",
    "explorer",
    "polars",
    "tabular",
    "terminal",
    "tui",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Terminals",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "polars>=1.18",
    "textual>=1.0",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/oxenfree999/psift"
Repository = "https://github.com/oxenfree999/psift"
Issues = "https://github.com/oxenfree999/psift/issues"

[project.scripts]
psift = "psift.cli.main:cli"

[dependency-groups]
test = [
    "pytest>=9.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.0",
    "inline-snapshot>=0.32",
]
lint = [
    "ruff>=0.8",
    "ty>=0.0",
]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
asyncio_mode = "auto"
xfail_strict = true
filterwarnings = ["error"]

[tool.inline-snapshot]
format-command = "ruff format --stdin-filename {filename}"

[tool.coverage.run]
source = ["psift"]
branch = true

[tool.coverage.paths]
source = ["src/", "*/src/"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "D100",
    "D104",
    "D203",
    "D213",
    "EM101",
    "FBT",
    "PLR0913",
    "T201",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "D", "PLR2004", "S101", "S108"]
